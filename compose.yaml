name: bcobca-backend

x-backend-environment: &backend-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__Default: 'Host=db;Port=5432;Database=bcobca_db;Username=bcobca;Password="${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}"'

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: bcobca_db
      POSTGRES_USER: bcobca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: final
    env_file: .env
    environment: *backend-environment
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
